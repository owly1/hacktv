<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14130F">
<meta name="description" content="BOSCO — Bushfire Observation, Simulation and Coordination Operations. Drone observation, fire-spread simulation and human-reviewed briefings in one wildfire workspace.">
<title>BOSCO</title>
<link rel="preload" href="vendor/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vendor/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:400 800;font-display:swap;src:url(vendor/fonts/bricolage-grotesque-latin.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:400 700;font-display:swap;src:url(vendor/fonts/instrument-sans-latin.woff2) format("woff2")}
*{box-sizing:border-box}
body{margin:0;background:#14130F;color:#F3EFE6;font-family:"Instrument Sans",system-ui,sans-serif}
a{color:#F3EFE6}
:focus-visible{outline:3px solid #E8562A;outline-offset:4px}
.stage{position:relative;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:64px 32px}
.contours{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.content{position:relative;width:100%;max-width:1040px;display:flex;flex-direction:column;align-items:flex-start;gap:56px}
.title{display:flex;flex-direction:column;gap:40px}
h1{margin:0;display:flex;align-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(84px,16vw,232px);line-height:.82;letter-spacing:-.035em}
h1 svg{width:.74em;height:.74em;margin:0 .02em 0 .04em;flex-shrink:0}
.expansion{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:500;font-size:clamp(18px,1.9vw,26px);line-height:1.3;color:#D9D3C6}
.expansion b{color:#E8562A;font-weight:800}
.rule{width:100%;height:1px;background:#2E2C25}
.cta-row{width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:28px 48px}
.cta-row p{margin:0;flex:1 1 420px;font-size:clamp(17px,1.5vw,20px);line-height:1.5;color:#B9B3A6;max-width:600px}
.cta{display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:0 32px;border-radius:999px;background:#E8562A;color:#14130F;font-weight:700;font-size:18px;text-decoration:none;transition:transform .15s,background .15s}
.cta:hover{background:#FF6B3D;transform:translateX(3px)}
.cta svg{width:20px;height:20px}
.links{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:14px;color:#8C8679}
.links a{color:#B9B3A6;text-decoration:underline;text-underline-offset:3px}
.links a:hover{color:#E8562A}
@keyframes bx-orbit{to{transform:rotate(360deg)}}
@keyframes bx-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.97,1.05)}}
@keyframes bx-flicker{0%,100%{transform:scale(1,1);opacity:1}40%{transform:scale(.94,1.08);opacity:.85}70%{transform:scale(1.03,.95);opacity:1}}
@keyframes bx-ripple{0%{transform:scale(.92);opacity:.6}100%{transform:scale(1.25,1.4);opacity:0}}
@keyframes bx-ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@keyframes bx-contour{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.05) rotate(-1.2deg)}}
.bx-orbit{transform-origin:60px 60px;animation:bx-orbit 10s linear infinite}
.bx-fire{transform-origin:60px 90px;animation:bx-breathe 2.2s ease-in-out infinite}
.bx-core{transform-origin:61px 86px;animation:bx-flicker 1.2s ease-in-out infinite}
.bx-halo{transform-origin:60px 90px;animation:bx-ripple 2.4s ease-out infinite}
.bx-ping{transform-box:fill-box;transform-origin:center;animation:bx-ping 2s ease-out infinite}
.bx-c{transform-origin:1060px 470px;animation:bx-contour 9s ease-in-out infinite}
@keyframes bx-cover{from{opacity:0}to{opacity:1}}
@keyframes bx-settle{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bx-recede{to{transform:scale(.94);opacity:0;filter:blur(6px)}}
.leaving .content{animation:bx-recede .45s ease-in both}
.cover{position:fixed;inset:0;z-index:50;pointer-events:none;background:#14130F;display:none;align-items:center;justify-content:center}
.leaving .cover{display:flex;animation:bx-cover .45s ease-out both}
.cover svg{width:160px;height:160px;animation:bx-settle .5s cubic-bezier(.2,.7,.2,1) both}
@media(prefers-reduced-motion:reduce){.bx-orbit,.bx-fire,.bx-core,.bx-halo,.bx-ping,.bx-c{animation:none}}
@media(max-width:560px){.stage{padding:48px 20px}.content{gap:40px}.title{gap:28px}}
/* Exploded-view scroll sequence (reveal.js). --reveal-scroll is how far the visitor
   scrolls while the frames play, in viewport heights: raise it for a slower reveal.
   --reveal-backdrop is the studio grey along the top of the photos; the page fades
   from its own background into it above the sequence. */
:root{--reveal-backdrop:#C2C1C2}
.reveal-fade{height:60vh;background:linear-gradient(to bottom,#14130F 0%,#1E1D1A 12%,#3C3B39 28%,#686767 46%,#939293 64%,#B3B2B3 80%,#BFBEBF 92%,var(--reveal-backdrop) 100%)}
.reveal{--reveal-scroll:300;position:relative;background:var(--reveal-backdrop);height:calc((100 + var(--reveal-scroll)) * 1vh)}
.reveal-sticky{position:sticky;top:0;height:100vh;overflow:hidden}
.reveal canvas{display:block;width:100%;height:100%}
@supports(height:1svh){.reveal-fade{height:60svh}.reveal{height:calc((100 + var(--reveal-scroll)) * 1svh)}.reveal-sticky{height:100svh}}
@media(prefers-reduced-motion:reduce){.reveal{height:auto}.reveal-sticky{position:static;height:auto;aspect-ratio:16/9;max-height:100svh}}
</style>
</head>
<body>

  <nav class="links" aria-label="More"><a href="guide.html">Team execution guide</a><a href="test-marker.html">Print the fire test marker</a></nav>
 </main>

</div>
<div class="reveal-fade" aria-hidden="true"></div>
<section class="reveal" id="reveal">
 <div class="reveal-sticky">
  <canvas role="img" aria-label="The BOSCO drone, a Parrot ANAFI, coming apart as you scroll: the BOSCO shell lifts away to show the flight computer and camera boards, the battery, the gimbal camera, the motors and the arms."></canvas>
 </div>
</section>
<script src="reveal.js"></script>
<script>
// "Get started": recede the title, settle the lens mark, then open the dashboard
// (whose own intro irises the lens open). Plain navigation with reduced motion
// or a modified click (new tab / window).
document.getElementById('get-started').addEventListener('click', function (e) {
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  e.preventDefault();
  const stage = document.getElementById('stage');
  if (stage.classList.contains('leaving')) return;
  stage.classList.add('leaving');
  setTimeout(() => { location.href = this.href; }, 520);
});
// Coming back with the browser's Back button restores the page from cache; reset it.
window.addEventListener('pageshow', () => document.getElementById('stage').classList.remove('leaving'));
</script>
